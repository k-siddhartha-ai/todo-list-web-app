<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 16px;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #222;
    }

    #toDo {
        max-width: 650px;
        margin: 30px auto 0;
        padding: 35px;
        text-align: center;
        background: white;
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.2);
    }

    #toDo h1 {
        margin: 0 0 8px;
        font-size: 32px;
        font-weight: 800;
        color: #4338ca;
    }

    #todayDate {
        margin-bottom: 25px;
        color: #777;
        font-size: 14px;
    }

    .task-controls {
        display: flex;
        gap: 10px;
    }

    #taskInput,
    #searchInput {
        width: 100%;
        min-width: 0;
        padding: 13px 15px;
        font: inherit;
        border: 1px solid #ddd;
        border-radius: 12px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    #taskInput:focus,
    #searchInput:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    button {
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
        opacity: 0.88;
        transform: translateY(-1px);
    }

    #addButton {
        padding: 12px 20px;
        color: white;
        background: #4f46e5;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        white-space: nowrap;
    }

    #searchInput {
        margin-top: 18px;
    }

    #toDoList {
        max-width: 650px;
        margin: 22px auto;
        padding: 0;
        list-style: none;
    }

    #toDoList li {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        padding: 16px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.10);
    }

    .task-content {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: left;
    }

    .task-name {
        display: block;
        font-size: 15px;
        font-weight: 600;
    }

    /* The line appears only when a task is completed. */
    .task-name.completed {
        text-decoration: line-through;
        text-decoration-thickness: 2px;
        text-decoration-color: #16a34a;
        color: #999;
    }

    .task-status {
        display: inline-block;
        margin-top: 5px;
        padding: 3px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
    }

    .pending-status {
        color: #92400e;
        background: #fef3c7;
    }

    .completed-status {
        color: #166534;
        background: #dcfce7;
    }

    .task-action {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
    }

    .complete-button {
        color: #166534;
        background: #dcfce7;
    }

    .edit-button {
        color: #1d4ed8;
        background: #dbeafe;
    }

    .delete-button {
        color: #b91c1c;
        background: #fee2e2;
    }

    .empty-message {
        padding: 20px;
        color: #666;
        text-align: center;
        background: white;
        border-radius: 12px;
    }

    @media (max-width: 480px) {
        body {
            padding: 20px 10px;
        }

        #toDo {
            margin-top: 10px;
            padding: 24px 16px;
        }

        #toDo h1 {
            font-size: 27px;
        }

        #toDoList li {
            gap: 6px;
            padding: 12px 8px;
        }

        .task-action {
            width: 31px;
            height: 34px;
            font-size: 14px;
        }

        #addButton {
            padding: 12px;
        }
    }
</style>

<body>
    <div id="toDo">
        <h1>To do List</h1>
        <p id="todayDate"></p>
        <div class="task-controls">
            <input type="text" id="taskInput" placeholder="✍️ Enter your task">
            <button id="addButton" onclick="Enter()">+ Add</button>
        </div>

        <input type="text" id="searchInput" placeholder="🔍 Search your tasks..." oninput="displayTasks()">


    </div>
    <ul id="toDoList"></ul>

    <script>
        let tasks = [];
        try {
            const savedTask = localStorage.getItem("myTasks");

            if (savedTask) {
                const parsedTask = JSON.parse(savedTask);

                if (Array.isArray(parsedTask)) {

                    tasks = parsedTask;

                }

            }
        } catch (error) {
            console.log("invalid saved task data:", error);
            localStorage.removeItem("myTasks");
        }

        //Display our task in browser by converting the tasks of an array into the string using json.stringify() method
        function saveTask() {

            localStorage.setItem("myTasks", JSON.stringify(tasks));
        }
        function displayData() {
            const date = new Date().toDateString();
            document.getElementById("todayDate").textContent = date;
            //console.log(date);
        }
        displayData();


        //displayTasks()
        function displayTasks() {
            const list = document.getElementById("toDoList");
            const searchValue = document
                .getElementById("searchInput")
                .value.trim()
                .toLowerCase();

            // Clear previously displayed tasks
            list.innerHTML = "";

            // Filter tasks while preserving their original array indexes
            const filteredTasks = tasks
                .map((item, index) => ({ item, index }))
                .filter(({ item }) =>
                    item.todo.toLowerCase().includes(searchValue)
                );

            // Show a message if no tasks match
            if (filteredTasks.length === 0) {
                const message = document.createElement("li");
                message.className = "empty-message";
                message.textContent = searchValue
                    ? "No matching tasks found."
                    : "No tasks yet. Add your first task!";

                list.appendChild(message);
                return;
            }

            filteredTasks.forEach(({ item, index }) => {
                const li = document.createElement("li");

                // Task information container
                const content = document.createElement("div");
                content.className = "task-content";

                // Task name
                const taskName = document.createElement("span");
                taskName.className = "task-name";
                taskName.textContent = item.todo;

                // Apply strikethrough to completed tasks
                if (item.completed) {
                    taskName.classList.add("completed");
                }

                // Task status
                const status = document.createElement("span");
                status.className = item.completed
                    ? "task-status completed-status"
                    : "task-status pending-status";

                status.textContent = item.completed
                    ? "Completed"
                    : "Pending";

                content.appendChild(taskName);
                content.appendChild(status);

                // Complete / undo button
                const completeButton = document.createElement("button");
                completeButton.className =
                    "task-action complete-button";

                completeButton.textContent = item.completed ? "↩" : "✓";

                completeButton.onclick = function () {
                    tasks[index].completed = !tasks[index].completed;
                    saveTask();
                    displayTasks();
                };

                // Edit button
                const editButton = document.createElement("button");
                editButton.className = "task-action edit-button";
                editButton.textContent = "✏️";

                editButton.onclick = function () {
                    const newTask = prompt("Edit your task:", item.todo);

                    if (newTask !== null && newTask.trim() !== "") {
                        tasks[index].todo = newTask.trim();
                        saveTask();
                        displayTasks();
                    }
                };

                // Delete button
                const deleteButton = document.createElement("button");
                deleteButton.className = "task-action delete-button";
                deleteButton.textContent = "🗑️";

                deleteButton.onclick = function () {
                    tasks.splice(index, 1);
                    saveTask();
                    displayTasks();
                };

                // Add elements to the task card
                li.appendChild(content);
                li.appendChild(completeButton);
                li.appendChild(editButton);
                li.appendChild(deleteButton);

                list.appendChild(li);
            });
        }



        // async function loadDummyData() {
        // try {


        // const response= await fetch("https://dummyjson.com/todos");

        // if(!response.ok){
        // console.log("failed to load the task")
        // throw new Error("failed to load task");
        // }
        // const data=await response.json();//wait for api response it return data
        //the returned data will be stored in an array(task) toDo() is                    
        // tasks=data.todos;//todos is property inside the array which store task in an array
        // displayTasks();
        // }
        // catch (error) {
        //throw new Error("failed to load task");
        // console.log(error);
        // document.getElementById("toDoList").textContent=`failed to load the task,please check your internet connection`;
        // }

        // 
        // }
        // loadDummyData();

        function Enter() {

            let input = document.getElementById("taskInput");
            let taskName = input.value.trim();

            if (taskName == "") {
                alert("Please Enter the task");
                return;
            }

            tasks.unshift({
                todo: taskName,
                completed: false
            });
            saveTask();
            displayTasks();
            input.value = "";


        }








        displayTasks();
    </script>


    <i class="fa-solid fa-circle-user"></i>

</body>

</html>
